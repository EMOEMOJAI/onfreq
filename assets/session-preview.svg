<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">One ATC session, from online to offline</title>
  <desc id="desc">An illustrative Example Tower session card is green while online at 118.100 MHz. The same card becomes grey after disconnecting, retaining its two-hour fourteen-minute session history. No real member data is shown.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="960" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101D21"/><stop offset="1" stop-color="#0A1016"/>
    </linearGradient>
    <linearGradient id="accent" x1="42" y1="0" x2="435" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EE88F"/><stop offset="1" stop-color="#26BFB6"/>
    </linearGradient>
  </defs>
  <rect width="960" height="420" rx="20" fill="url(#backdrop)"/>
  <rect x=".5" y=".5" width="959" height="419" rx="19.5" stroke="#26343B"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="42" y="42" fill="#93A6AD" font-size="13" font-weight="600" letter-spacing="2">ONE SESSION. ONE CARD.</text>
    <text x="918" y="42" text-anchor="end" fill="#61757E" font-size="13">ILLUSTRATIVE PREVIEW</text>
    <rect x="42" y="70" width="393" height="276" rx="12" fill="#18232B" stroke="#30444A"/>
    <path d="M54 70H423A12 12 0 0 1 435 82V84H42V82A12 12 0 0 1 54 70Z" fill="url(#accent)"/>
    <circle cx="70" cy="112" r="5" fill="#6EE88F"/>
    <text x="85" y="117" fill="#8FF1AA" font-size="13" font-weight="700" letter-spacing="1.3">ONLINE</text>
    <text x="64" y="159" fill="#F0F6F8" font-size="28" font-weight="700">XAAA_TWR</text>
    <text x="64" y="186" fill="#A7B7C0" font-size="16">Example Tower · Example Intl</text>
    <path d="M64 208H413" stroke="#304149"/>
    <text x="64" y="247" fill="#F0F6F8" font-size="24" font-weight="600">118.100 <tspan fill="#91A5AD" font-size="16" font-weight="400">MHz</tspan></text>
    <rect x="361" y="225" width="52" height="28" rx="6" fill="#25363E"/>
    <text x="387" y="244" text-anchor="middle" fill="#C5D6DC" font-size="13" font-weight="600">TWR</text>
    <text x="64" y="287" fill="#C5D6DC" font-size="16">Online since 2 hours ago</text>
    <text x="64" y="320" fill="#7F959F" font-size="14">A real frequency. Ready to control.</text>
    <path d="M460 208H500M491 199L500 208L491 217" stroke="#59B9A7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="525" y="70" width="393" height="276" rx="12" fill="#151E27" stroke="#2F3D47"/>
    <path d="M537 70H906A12 12 0 0 1 918 82V84H525V82A12 12 0 0 1 537 70Z" fill="#72808D"/>
    <circle cx="553" cy="112" r="5" fill="#94A1AD"/>
    <text x="568" y="117" fill="#B7C3CD" font-size="13" font-weight="700" letter-spacing="1.3">OFFLINE</text>
    <text x="547" y="159" fill="#E1E8EF" font-size="28" font-weight="700">XAAA_TWR</text>
    <text x="547" y="186" fill="#96A6B3" font-size="16">Example Tower · Example Intl</text>
    <path d="M547 208H896" stroke="#2C3B46"/>
    <text x="547" y="247" fill="#E1E8EF" font-size="24" font-weight="600">2h 14m <tspan fill="#91A1AE" font-size="16" font-weight="400">on frequency</tspan></text>
    <text x="547" y="287" fill="#B8C6D2" font-size="16">Session 09:12 → 11:26</text>
    <text x="547" y="320" fill="#7F929F" font-size="14">Disconnected 3 minutes ago</text>
    <text x="238.5" y="383" text-anchor="middle" fill="#A1B5BC" font-size="15">Appears when the controller tunes in</text>
    <text x="721.5" y="383" text-anchor="middle" fill="#A1B5BC" font-size="15">Edited in place when the session ends</text>
  </g>
</svg>
