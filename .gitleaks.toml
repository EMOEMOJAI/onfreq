# Gitleaks configuration for the hooks and CI (scripts/secret-scan.sh). The
# default rules miss low-entropy values, so this repository's own secret names
# are flagged whenever they are assigned a value of 16 or more characters.
title = "onfreq"

[extend]
useDefault = true

[[rules]]
id = "onfreq-secret-assignment"
description = "onfreq secret assigned a non-empty value"
regex = '''\b(?:POLL_SECRET|HISTORY_SECRET|IVAO_WEBHOOK_SECRET|IVAO_CLIENT_SECRET|DISCORD_BOT_TOKEN)\b["']?\s*[=:]\s*["'`]?([^\s"'`]{16,})'''
secretGroup = 1
keywords = ["poll_secret", "history_secret", "ivao_webhook_secret", "ivao_client_secret", "discord_bot_token"]

# Content-based only: hooks and CI scan `gitleaks stdin`, which has no paths.
# Test fixtures use values that begin with "synthetic-"; the other entries are
# published synthetic fixtures and code references to bindings, not values.
[[rules.allowlists]]
description = "Synthetic test fixtures and binding references"
regexTarget = "secret"
regexes = [
  '''^synthetic-[A-Za-z0-9-]*$''',
  '''^test-poll-secret$''',
  '''^\$\{btoa\(\w+\)\}\.synthetic\.token$''',
  '''^env\.[A-Z][A-Z0-9_]*,?$''',
]

# Operator Discord IDs: only lists of real-shaped snowflakes (15-20 digits) are
# flagged, under the setting name in any case, so names, references and empty values pass. Synthetic fixtures are a
# nonzero digit, eight or more zeros and one to three digits, for every item.
[[rules]]
id = "onfreq-discord-id-assignment"
description = "onfreq Discord ID setting assigned a snowflake list"
regex = '''\b(?i:MENTION_ROLE_ID|GCA_DISCORD_GUILD_ID|GCA_MEMBER_ROLE_ID|GCA_VERIFIED_ROLE_ID|GCA_COPY_USER_ID|DISCORD_CHANNEL_IDS)\b["']?\s*[=:]\s*["'`]?(\d{15,20}(?:\s*,\s*\d{15,20})*)'''
secretGroup = 1
keywords = ["mention_role_id", "gca_discord_guild_id", "gca_member_role_id", "gca_verified_role_id", "gca_copy_user_id", "discord_channel_ids"]

[[rules.allowlists]]
description = "Synthetic snowflakes only, across the whole list"
regexTarget = "secret"
regexes = ['''^[1-9]0{8,}[0-9]{1,3}(?:\s*,\s*[1-9]0{8,}[0-9]{1,3})*$''']

# Private policy and label JSON: a JSON object or array literal assigned to one
# of these names is flagged, up to its closing bracket before a quote or the
# end of the line. Expressions such as JSON.stringify(...) are not literals.
[[rules]]
id = "onfreq-json-setting-assignment"
description = "onfreq private JSON setting assigned a literal"
regex = '''(?m)\b(?i:GCA_REGIONS|GCA_APPROVALS|GCA_HOME_OVERRIDES|FIR_LABELS)\b["']?\s*[=:]\s*["'`]?([\[{][^\n]*?[\]}])(?:["'`]|\s*$)'''
secretGroup = 1
keywords = ["gca_regions", "gca_approvals", "gca_home_overrides", "fir_labels"]

[[rules.allowlists]]
description = "Empty JSON and exact published synthetic fixtures"
regexTarget = "secret"
regexes = [
  '''^\{\}$''',
  '''^\[\]$''',
  '''^\{"600001":"ZZ"\}$''',
]

# A multi-line JSON literal: the setting's value opens an object or array and
# the line ends there. Known limit: a pretty-printed first line that continues
# after the bracket, such as NAME='{"KEY": [, matches neither JSON rule.
[[rules]]
id = "onfreq-json-setting-multiline"
description = "onfreq private JSON setting opens a multi-line literal"
regex = '''(?m)\b(?i:GCA_REGIONS|GCA_APPROVALS|GCA_HOME_OVERRIDES|FIR_LABELS)\b["']?\s*[=:]\s*["'`]?([\[{])\s*$'''
secretGroup = 1
keywords = ["gca_regions", "gca_approvals", "gca_home_overrides", "fir_labels"]

# Deployment settings in dotenv or shell lines (NAME=value, optionally after
# export), with the exact uppercase names those files use. The secret is the
# first non-empty group: a whole quoted value, or an unquoted value up to a #
# comment or the end of the line, as dotenv reads it. TypeScript fixtures and
# `wrangler secret put` commands have no such line. Synthetic values pass:
# prefix lists whose every item starts with Q or X, which no ICAO region uses,
# and names that begin with "synthetic".
[[rules]]
id = "onfreq-deploy-setting-assignment"
description = "onfreq deployment setting assigned a value"
regex = '''(?m)^[+]?\s*(?:export\s+)?(?:FIR_PREFIXES|COORDINATOR_NAME)\s*=[ \t]*(?:"([^"\n]+)"|'([^'\n]+)'|`([^`\n]+)`|([^\s"'`#](?:[^#\n]*[^\s#])?))'''
keywords = ["fir_prefixes", "coordinator_name"]

[[rules.allowlists]]
description = "Synthetic FIR prefixes and coordinator names"
regexTarget = "secret"
regexes = [
  '''(?i)^\s*[QX][A-Z]{0,3}(?:\s*,\s*[QX][A-Z]{0,3})*\s*,?\s*$''',
  '''^synthetic[-A-Za-z0-9]*$''',
]

# Known limits: values held in constants or variables under other names, files
# that never write these setting names next to their values, deployment
# settings outside dotenv or shell lines, and the JSON first line above are not
# covered; check:privacy and review still apply.
