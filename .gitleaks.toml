# Gitleaks configuration for the hooks and CI (scripts/secret-scan.sh). The
# default rules miss low-entropy values, so this repository's own secret names
# are flagged whenever they are assigned a value of 16 or more characters.
title = "onfreq"

[extend]
useDefault = true

[[rules]]
id = "onfreq-secret-assignment"
description = "onfreq secret assigned a non-empty value"
regex = '''\b(?:POLL_SECRET|HISTORY_SECRET|IVAO_WEBHOOK_SECRET|IVAO_CLIENT_SECRET|DISCORD_BOT_TOKEN)\b["']?\s*[=:]\s*["'`]?[ \t]*([^\s"'`]{16,})'''
secretGroup = 1
keywords = ["poll_secret", "history_secret", "ivao_webhook_secret", "ivao_client_secret", "discord_bot_token"]

# Content-based only: hooks and CI scan `gitleaks stdin`, which has no paths.
# Test fixtures use values that begin with "synthetic-"; the other entries are
# published synthetic fixtures and code references to bindings, not values.
[[rules.allowlists]]
description = "Synthetic test fixtures and binding references"
regexTarget = "secret"
regexes = [
  '''^synthetic-[A-Za-z0-9-]*$''',
  '''^test-poll-secret$''',
  '''^\$\{btoa\(\w+\)\}\.synthetic\.token$''',
  '''^env\.[A-Z][A-Z0-9_]*,?$''',
]

# Operator Discord IDs: only lists of real-shaped snowflakes (15-20 digits) are
# flagged, under the setting name in any case, so names, references and empty values pass. Synthetic fixtures are a
# nonzero digit, eight or more zeros and one to three digits, for every item.
[[rules]]
id = "onfreq-discord-id-assignment"
description = "onfreq Discord ID setting assigned a snowflake list"
regex = '''\b(?i:MENTION_ROLE_ID|GCA_DISCORD_GUILD_ID|GCA_MEMBER_ROLE_ID|GCA_VERIFIED_ROLE_ID|GCA_COPY_USER_ID|DISCORD_CHANNEL_IDS)\b["']?\s*[=:]\s*["'`]?[ \t]*(\d{15,20}(?:\s*,\s*\d{15,20})*)'''
secretGroup = 1
keywords = ["mention_role_id", "gca_discord_guild_id", "gca_member_role_id", "gca_verified_role_id", "gca_copy_user_id", "discord_channel_ids"]

[[rules.allowlists]]
description = "Synthetic snowflakes only, across the whole list"
regexTarget = "secret"
regexes = ['''^[1-9]0{8,}[0-9]{1,3}(?:\s*,\s*[1-9]0{8,}[0-9]{1,3})*$''']

# Private policy and label JSON: a JSON object or array literal assigned to one
# of these names is flagged, up to its closing bracket before a quote or the
# end of the line. Expressions such as JSON.stringify(...) are not literals.
[[rules]]
id = "onfreq-json-setting-assignment"
description = "onfreq private JSON setting assigned a literal"
regex = '''(?m)\b(?i:GCA_REGIONS|GCA_APPROVALS|GCA_HOME_OVERRIDES|FIR_LABELS)\b["']?\s*[=:]\s*["'`]?[ \t]*([\[{][^\n]*?[\]}])(?:["'`]|\s*$)'''
secretGroup = 1
keywords = ["gca_regions", "gca_approvals", "gca_home_overrides", "fir_labels"]

[[rules.allowlists]]
description = "Empty JSON and exact published synthetic fixtures"
regexTarget = "secret"
regexes = [
  '''^\{\}$''',
  '''^\[\]$''',
  '''^\{"600001":"ZZ"\}$''',
]

# A multi-line JSON literal: the setting's value opens an object or array and
# the line ends there.
[[rules]]
id = "onfreq-json-setting-multiline"
description = "onfreq private JSON setting opens a multi-line literal"
regex = '''(?m)\b(?i:GCA_REGIONS|GCA_APPROVALS|GCA_HOME_OVERRIDES|FIR_LABELS)\b["']?\s*[=:]\s*["'`]?[ \t]*([\[{])\s*$'''
secretGroup = 1
keywords = ["gca_regions", "gca_approvals", "gca_home_overrides", "fir_labels"]

# The first line of a pretty-printed JSON literal that continues after the
# bracket, as in NAME='{"KEY": [ and NAME = [{"k": 1}, where the value opens an
# object or array, then, after optional blanks and brackets, a JSON string
# (its quotes may be shell-escaped), and the line ends in an opening bracket, a
# comma or a colon. No quote or backtick may follow the string, so the match
# cannot run past the end of a quoted value into later code on the line.
[[rules]]
id = "onfreq-json-setting-first-line"
description = "onfreq private JSON setting opens a pretty-printed literal"
regex = '''(?m)\b(?i:GCA_REGIONS|GCA_APPROVALS|GCA_HOME_OVERRIDES|FIR_LABELS)\b["']?\s*[=:]\s*["'`]?[ \t]*([\[{][ \t\[{]*\\?"[^"'`\n]*\\?"[^'`\n]*[\[{,:])[ \t\r]*$'''
secretGroup = 1
keywords = ["gca_regions", "gca_approvals", "gca_home_overrides", "fir_labels"]

# Deployment settings in dotenv or shell lines (NAME=value, optionally after
# export), with the exact uppercase names those files use. The secret is the
# first non-empty group: a whole quoted value, or an unquoted value up to a #
# comment or the end of the line, as dotenv reads it. TypeScript fixtures and
# `wrangler secret put` commands have no such line. One rule per name, so each
# allowlist applies to its own setting: synthetic FIR prefix lists have every
# item start with Q or X, which no ICAO region uses.
[[rules]]
id = "onfreq-fir-prefixes-assignment"
description = "onfreq FIR_PREFIXES assigned a value"
regex = '''(?m)^[+]?\s*(?:export\s+)?FIR_PREFIXES\s*=[ \t]*(?:"([^"\n]+)"|'([^'\n]+)'|`([^`\n]+)`|([^\s"'`#](?:[^#\n]*[^\s#])?))'''
keywords = ["fir_prefixes"]

[[rules.allowlists]]
description = "Synthetic FIR prefixes"
regexTarget = "secret"
regexes = ['''(?i)^\s*[QX][A-Z]{0,3}(?:\s*,\s*[QX][A-Z]{0,3})*\s*,?\s*$''']

# FIR prefixes anywhere else on a line, with the exact uppercase name: a quoted
# list of one to four letter items (blanks allowed inside the quotes: tab, VT,
# FF, CR, space, Unicode spaces, a byte order mark and the line and paragraph
# separators) whose first item does not start with Q or X, as in TypeScript,
# JSON, YAML or PowerShell (real lists have no Q or X item); an unquoted
# uppercase list that ends the line, as in YAML or a compose list item;
# NAME=list without blanks, as after env or A=1; or NAME:list, as in
# `wrangler dev --var NAME:list`, with items in either case, up to a blank,
# quote, ;, &, | or ). So code (`NAME: prefixes`), names in prose and
# `wrangler secret put` pass, and so do values that are not prefix lists. Lists
# of Q and X items, with empty items, are synthetic.
[[rules]]
id = "onfreq-fir-prefixes-property"
description = "onfreq FIR_PREFIXES assigned a prefix list"
regex = '''(?m)\bFIR_PREFIXES\b["']?[ \t]*[=:][ \t]*(?:["'`]([\t\v\f\r \p{Zs}\x{FEFF}\x{2028}\x{2029}]*[A-PR-WYZa-pr-wyz][A-Za-z]{0,3}(?:[\t\v\f\r \p{Zs}\x{FEFF}\x{2028}\x{2029}]*,[\t\v\f\r \p{Zs}\x{FEFF}\x{2028}\x{2029}]*[A-Za-z]{0,4})*[\t\v\f\r \p{Zs}\x{FEFF}\x{2028}\x{2029}]*)["'`]|([A-Z]{1,4}(?:[ \t]*,[ \t]*[A-Z]{1,4})*)[ \t\r]*(?:#[^\n]*)?$)|\bFIR_PREFIXES=([A-Za-z]{1,4}(?:,[A-Za-z]{0,4})*)(?:[ \t\r;&|)]|$)|\bFIR_PREFIXES:([A-Za-z]{1,4}(?:[ \t]*,[ \t]*[A-Za-z]{0,4})*)(?:[\s"'`;&|)]|$)'''
keywords = ["fir_prefixes"]

[[rules.allowlists]]
description = "Synthetic FIR prefixes"
regexTarget = "secret"
regexes = ['''(?i)^\s*[QX][A-Z]{0,3}(?:\s*,\s*(?:[QX][A-Z]{0,3})?)*\s*$''']

# Synthetic coordinator names begin with "synthetic".
[[rules]]
id = "onfreq-coordinator-name-assignment"
description = "onfreq COORDINATOR_NAME assigned a value"
regex = '''(?m)^[+]?\s*(?:export\s+)?COORDINATOR_NAME\s*=[ \t]*(?:"([^"\n]+)"|'([^'\n]+)'|`([^`\n]+)`|([^\s"'`#](?:[^#\n]*[^\s#])?))'''
keywords = ["coordinator_name"]

[[rules.allowlists]]
description = "Synthetic coordinator names"
regexTarget = "secret"
regexes = ['''^synthetic[-A-Za-z0-9]*$''']

# The coordinator name as NAME:value, as in `wrangler dev --var NAME:value`,
# anywhere on a line, with the exact uppercase name, up to a blank, quote, #, ;,
# &, | or ). Code and JSON (`NAME: value`, `"NAME":`) have no such form.
[[rules]]
id = "onfreq-coordinator-name-colon"
description = "onfreq COORDINATOR_NAME passed as NAME:value"
regex = '''\bCOORDINATOR_NAME:([^\s"'`#;&|)]+)'''
keywords = ["coordinator_name"]

[[rules.allowlists]]
description = "Synthetic coordinator names"
regexTarget = "secret"
regexes = ['''^synthetic[-A-Za-z0-9]*$''']

# Identifying settings, under the setting name in any case and in any file
# type. The IVAO client ID is a quoted value of eight or more characters or an
# unquoted value containing a digit, so code such as `IVAO_CLIENT_ID: clientId`
# and short test values pass. Synthetic IDs begin with "synthetic-".
[[rules]]
id = "onfreq-ivao-client-id-assignment"
description = "onfreq IVAO_CLIENT_ID assigned a value"
regex = '''\b(?i:IVAO_CLIENT_ID)\b["']?\s*[=:]\s*(?:["'`][ \t]*([^\s"'`]{8,})|([^\s"'`,;)}\]]*[0-9][^\s"'`,;)}\]]*))'''
keywords = ["ivao_client_id"]

[[rules.allowlists]]
description = "Synthetic, published fixture and all-zero client IDs"
regexTarget = "secret"
regexes = [
  '''^synthetic-[A-Za-z0-9-]*$''',
  '''^test-client$''',
  '''^0+(?:-0+)*$''',
]

# Excluded callsigns: a comma list on one line whose first item has letters,
# digits or dashes before an underscore, as callsigns do, so a variable
# (`EXCLUDED_CALLSIGNS: a,`) or reference (`env.EXCLUDED_CALLSIGNS`) passes.
# Blanks before the list and around commas are tab, VT, FF, CR, space, Unicode
# spaces, a byte order mark and the line and paragraph separators; an item runs
# to an ASCII blank, comma, quote, semicolon or closing bracket, so a dash, dot,
# < or Unicode space inside an item cannot end the list early.
# Synthetic callsigns start with Q or X, which no ICAO region uses: every item
# does, and runs to a comma or any of those blanks, so trailing text such as a
# full stop or </code> after a synthetic item passes while a blank inside one
# does not.
[[rules]]
id = "onfreq-excluded-callsigns-assignment"
description = "onfreq EXCLUDED_CALLSIGNS assigned a callsign list"
regex = '''\b(?i:EXCLUDED_CALLSIGNS)\b["']?\s*[=:]\s*["'`]?[\t\v\f\r \p{Zs}\x{FEFF}\x{2028}\x{2029}]*([A-Za-z0-9-]+_[^\s,"'`;)}\]]*(?:[\t\v\f\r \p{Zs}\x{FEFF}\x{2028}\x{2029}]*,[\t\v\f\r \p{Zs}\x{FEFF}\x{2028}\x{2029}]*[^\s,"'`;)}\]]*)*)'''
secretGroup = 1
keywords = ["excluded_callsigns"]

[[rules.allowlists]]
description = "Synthetic callsigns only, across the whole list"
regexTarget = "secret"
regexes = ['''(?i)^[QX][^,\s\v\p{Zs}\x{FEFF}\x{2028}\x{2029}]*(?:[\t\v\f\r \p{Zs}\x{FEFF}\x{2028}\x{2029}]*,[\t\v\f\r \p{Zs}\x{FEFF}\x{2028}\x{2029}]*(?:[QX][^,\s\v\p{Zs}\x{FEFF}\x{2028}\x{2029}]*)?)*[\t\v\f\r \p{Zs}\x{FEFF}\x{2028}\x{2029}]*$''']

# The GCA policy link: any scheme://URL. Only hosts under the reserved .test,
# .example and .invalid domains pass, ending the URL or followed by a path,
# query or fragment, so userinfo (x.test@host), subdomain (test.host) and path
# (host/x.test) forms, and ports, are flagged.
[[rules]]
id = "onfreq-gca-policy-url-assignment"
description = "onfreq GCA_POLICY_URL assigned a URL"
regex = '''\b(?i:GCA_POLICY_URL)\b["']?\s*[=:]\s*["'`]?[ \t]*([A-Za-z][A-Za-z0-9+.-]*://[^\s"'`]+)'''
secretGroup = 1
keywords = ["gca_policy_url"]

[[rules.allowlists]]
description = "URLs on reserved test hosts"
regexTarget = "secret"
regexes = ['''(?i)^https?://(?:[a-z0-9-]+\.)*(?:test|example|invalid)(?:[/?#]\S*)?$''']

# A quote, backtick or backslash inside the userinfo ends the rule above's
# match early, so a reserved host before it could pass: x.test"@host, as shell
# quoting joins it. This rule flags a link whose userinfo holds one of them
# before an @, with no allowlist, with one branch per opener: none, ", ' or a
# backtick. A blank or comma ends the link, so a later JSON field or comment
# holding an address passes; so does a ; or & right after the opener's closing
# quote, which ends the shell word (`"<link>";NEXT=1`, `"<link>"&&next`), and
# an @ right after a closing backtick, as after command substitution.
[[rules]]
id = "onfreq-gca-policy-url-quoted-userinfo"
description = "onfreq GCA_POLICY_URL with quoted userinfo"
regex = '''\b(?i:GCA_POLICY_URL)\b["']?\s*[=:]\s*([A-Za-z][A-Za-z0-9+.-]*://[A-Za-z0-9._~%!$&*+;=-]*["'`\\][A-Za-z0-9._~%!$&*+;=:"'`\\-]*@[^\s"'`]*|"[ \t]*[A-Za-z][A-Za-z0-9+.-]*://[A-Za-z0-9._~%!$&*+;=-]*(?:"(?:[A-Za-z0-9._~%!$*+=:"'`\\-][A-Za-z0-9._~%!$&*+;=:"'`\\-]*)?|['`\\][A-Za-z0-9._~%!$&*+;=:"'`\\-]*)@[^\s"'`]*|'[ \t]*[A-Za-z][A-Za-z0-9+.-]*://[A-Za-z0-9._~%!$&*+;=-]*(?:'(?:[A-Za-z0-9._~%!$*+=:"'`\\-][A-Za-z0-9._~%!$&*+;=:"'`\\-]*)?|["`\\][A-Za-z0-9._~%!$&*+;=:"'`\\-]*)@[^\s"'`]*|`[ \t]*[A-Za-z][A-Za-z0-9+.-]*://[A-Za-z0-9._~%!$&*+;=-]*(?:`[A-Za-z0-9._~%!$*+=:"'`\\-][A-Za-z0-9._~%!$&*+;=:"'`\\-]*|["'\\][A-Za-z0-9._~%!$&*+;=:"'`\\-]*)@[^\s"'`]*)'''
secretGroup = 1
keywords = ["gca_policy_url"]

# Known limits: values held in constants or variables under other names, files
# that never write these setting names next to their values, and a
# pretty-printed JSON first line that ends in a value rather than a bracket,
# comma or colon are not covered. Neither are values that start on a later line
# (a bracket on the next line or a YAML block scalar), escaped or encoded
# setting names, a coordinator name as NAME=value anywhere but at the start of a
# dotenv or shell line (env NAME=, A=1 NAME=, PowerShell, compose list items;
# NAME:value is covered), or FIR prefixes there unquoted, unless as NAME=list,
# NAME:list or an uppercase list that ends the line.
# Neither is a quoted FIR prefix list whose first item starts with Q or X.
# Identifying settings are missed as a quoted IVAO client ID shorter than eight
# characters or an unquoted one without a digit, a callsign list whose first
# item has no underscore or a dot before it (so env.NAME references pass), and
# a policy link without a scheme. Shell quoting that joins a synthetic quoted
# first item to the rest (NAME="QCXX_CTR",<item> or FIR_PREFIXES="QX",<item>),
# blanks written as escapes ("\t<item>", $'\f<item>') and Unicode letters
# that uppercase to Latin ones are not covered either. Gitleaks' default
# global allowlist passes values that start with "true", contain "false" or
# end with "null" (any case), $VAR-style templates, one repeated character and
# system paths; it cannot be removed while the default rules are extended.
# check:privacy and review still apply.
