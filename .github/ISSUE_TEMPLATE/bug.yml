name: Bug report
description: Report a reproducible problem using synthetic examples.
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, member or Discord IDs, approval records, private URLs, or unredacted logs/screenshots.
        For vulnerabilities or exposed credentials, use [private security reporting](https://github.com/EMOEMOJAI/onfreq/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include your Node.js version if the problem occurs during setup.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use invented names and IDs. Include only the minimum configuration needed, with credentials removed.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Expected and actual behaviour
      description: Describe what you expected and what happened instead.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal information and private deployment details from this report.
          required: true
